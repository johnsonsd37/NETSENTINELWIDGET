 - uses: actions/setup-dotnet@v4
    with:
      dotnet-version: 8.0.x

  - name: Build standalone Windows executable
    run: dotnet publish NetSentinelWidget.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

  - name: Upload executable
    uses: actions/upload-artifact@v4
    with:
      name: NetSentinelWidget-Windows
      path: publish/NetSentinelWidget.exe
